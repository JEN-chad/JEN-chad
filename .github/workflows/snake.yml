name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: JEN-chad
          outputs: |
           dist/github-contribution-grid-snake.svg?palette=github-dark&color_snake=%23007CF0&color_dots=%230D1117,%230B1F3A,%230055A5,%2300A6FF,%23B3E5FC

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
